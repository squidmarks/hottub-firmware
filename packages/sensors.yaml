# DS18B20 probes on the shared 1-Wire bus (GPIO1, 4.7k pull-up at the header).
#
# Discovery mode: no dallas_temp sensors yet. The one_wire bus logs every
# address it finds at boot. Once we know which address is which probe, add
# `dallas_temp` sensors with `address:` pinned to water_temp / outdoor_temp.

one_wire:
  - platform: gpio
    id: ow_bus
    pin: GPIO1

# Known probes. Roles are assigned once each probe is installed.
sensor:
  - platform: dallas_temp
    id: probe_a
    name: Probe A (0x5b0b257ca8dc5528)
    address: 0x5b0b257ca8dc5528
    resolution: 12
    update_interval: 5s
