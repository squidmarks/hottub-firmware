# Wi-Fi, logging, OTA. Wi-Fi only — never enable `ethernet:` on this board.
#
# The tub must keep running with no network, so nothing here may reboot the
# device because Wi-Fi is down (ESPHome's default is a reboot after 15 min).

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  ap:
    ssid: ${device_name}-fallback
    password: !secret fallback_ap_password

captive_portal:

# Home Assistant (and network logs) via the ESPHome native API. HA connects
# to us; if it doesn't, nothing happens — never reboot over it (the default
# reboots after 15 min with no client).
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s
  actions:
    # Same time-bounded hold contract as the web page / MQTT.
    #   mode: "pump_low" | "pump_high" | "heat";  target_f: °F;  hold_s: seconds
    - action: start_hold
      variables:
        mode: string
        target_f: float
        hold_s: int
      then:
        - lambda: |-
            int m = mode == "pump_low" ? 1 : mode == "pump_high" ? 2 : mode == "heat" ? 3 : -1;
            if (m < 0) {
              ESP_LOGW("api", "start_hold: unknown mode '%s'", mode.c_str());
              return;
            }
            id(start_hold)->execute(m, target_f, hold_s);
    - action: stop
      then:
        - script.execute: stop_hold
    # Jets layer over holds (like the tub button): "off" | "low" | "high".
    # "off" goes straight back to normal heating.
    - action: set_jets
      variables:
        level: string
      then:
        - lambda: |-
            int l = level == "off" ? 0 : level == "low" ? 1 : level == "high" ? 2 : -1;
            if (l < 0) {
              ESP_LOGW("api", "set_jets: unknown level '%s'", level.c_str());
              return;
            }
            id(set_jets)->execute(l);
    - action: quiet
      then:
        - script.execute: start_quiet
    # Keep warm indefinitely at target_f (enable=true), or turn it off.
    - action: keep_warm
      variables:
        enable: bool
        target_f: float
      then:
        - lambda: |-
            if (enable) {
              if (std::isnan(target_f) || target_f < ${min_target_f} || target_f > ${max_target_f}) {
                ESP_LOGW("api", "keep_warm: target %.1f out of range", target_f);
                return;
              }
              id(keep_warm_f).make_call().set_value(target_f).perform();
              id(quiet_remaining) = 0;
              // Set is the natural "try again": clear a latched fault. A real
              // one (no flow, hi-limit) comes straight back once the pump settles.
              if (id(fault_latched) != 0) ESP_LOGI("fault", "Fault cleared by Set");
              id(fault_latched) = 0;
              id(heater_warn) = false;
              id(keep_warm).turn_on();
              id(eco_restart)->execute();  // Set again restarts the eco countdown
            } else {
              id(keep_warm).turn_off();
            }

# Local control/status page at http://hottub.local/
web_server:
  port: 80
  version: 3
  auth:
    type: digest
    username: !secret web_username
    password: !secret web_password
  sorting_groups:
    - { id: grp_control, name: Control, sorting_weight: 10 }
    - { id: grp_status, name: Status, sorting_weight: 20 }
    - { id: grp_io, name: Relays and inputs, sorting_weight: 30 }
    - { id: grp_power, name: Power, sorting_weight: 35 }
    - { id: grp_settings, name: Settings, sorting_weight: 38 }
    - { id: grp_diag, name: Diagnostics, sorting_weight: 40 }

ota:
  # Encrypted with the API key; that key is what authenticates an upload.
  - platform: esphome
    encryption: {}

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    name: Wi-Fi RSSI
    entity_category: diagnostic
    update_interval: 30s
    web_server: { sorting_group_id: grp_diag }
  - platform: uptime
    id: uptime_s
    name: Uptime
    entity_category: diagnostic
    web_server: { sorting_group_id: grp_diag }
