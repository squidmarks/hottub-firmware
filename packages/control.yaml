# Holds, filter cycles, the tub button, quiet mode, thermostat, faults and
# the 1 s control loop.
#
# Pump demand, highest priority first:
#   1. quiet mode         everything off (button pressed while on HIGH)
#   2. button session     LOW or HIGH for button_session_min
#   3. hold               web/MQTT: PUMP_LOW, PUMP_HIGH or HEAT for N seconds
#   4. filter cycle       LOW, heating to eco, when no flow for filter_interval_h
#   5. grace              pump keeps running briefly after a hold expires
#   6. idle               OFF
# Heater run-on overrides OFF (never quiet-vs-hot-heater), and freeze
# protection (not built yet) will override everything.
#
# Hold modes: 0 = OFF, 1 = PUMP_LOW, 2 = PUMP_HIGH, 3 = HEAT (pump LOW + thermostat)
# Faults:     0 = NONE, 1 = NO_FLOW, 2 = OVER_TEMP, 3 = HEATER_UNKNOWN, 4 = SENSOR_FAIL
# A fault latches a heat lockout until the next hold or scheduled filter cycle.

globals:
  - { id: pump_state, type: int, initial_value: '0' }
  - { id: pump_since, type: uint32_t, initial_value: '0' }
  - { id: last_desired, type: int, initial_value: '0' }
  - { id: hold_mode, type: int, initial_value: '0' }
  - { id: hold_remaining, type: int, initial_value: '0' }    # seconds
  - { id: btn_mode, type: int, initial_value: '0' }          # 0 none, 1 LOW, 2 HIGH
  - { id: btn_remaining, type: int, initial_value: '0' }     # seconds
  - { id: last_press_ms, type: uint32_t, initial_value: '0' }
  - { id: press_result, type: int, initial_value: '0' }
  - { id: quiet_remaining, type: int, initial_value: '0' }   # seconds
  - { id: filter_active, type: bool, initial_value: 'false' }
  - { id: filter_remaining, type: int, initial_value: '0' }  # seconds
  - { id: filter_elapsed, type: int, initial_value: '0' }    # seconds
  - { id: no_flow_s, type: int, initial_value: '0' }
  - { id: runon_remaining, type: int, initial_value: '0' }   # seconds
  - { id: grace_remaining, type: int, initial_value: '0' }   # seconds
  - { id: heating, type: bool, initial_value: 'false' }      # thermostat latch
  - { id: heat_wanted, type: bool, initial_value: 'false' }
  - { id: fault_latched, type: int, initial_value: '0' }
  - { id: heat_on_since, type: uint32_t, initial_value: '0' }
  - { id: heat_start_temp, type: float, initial_value: '0' }
  - { id: water_last_ms, type: uint32_t, initial_value: '0' }

script:
  - id: start_hold
    parameters:
      mode: int
      target: float
      secs: int
    then:
      - lambda: |-
          if (mode < 0 || mode > 3) {
            ESP_LOGW("hold", "Rejected hold: bad mode %d", mode);
            return;
          }
          if (mode == 0) {
            id(stop_hold)->execute();
            return;
          }
          if (secs <= 0 || secs > ${max_hold_min} * 60) {
            ESP_LOGW("hold", "Rejected hold: duration %ds out of range", secs);
            return;
          }
          if (!std::isnan(target)) {
            if (target < ${min_target_f} || target > ${max_target_f}) {
              ESP_LOGW("hold", "Rejected hold: target %.1f°F out of range", target);
              return;
            }
            id(target_f).make_call().set_value(target).perform();
          }
          // An explicit remote command wins over the tub button.
          id(btn_mode) = 0;
          id(btn_remaining) = 0;
          id(quiet_remaining) = 0;
          id(hold_mode) = mode;
          id(hold_remaining) = secs;
          id(grace_remaining) = 0;
          if (id(fault_latched) != 0) ESP_LOGI("fault", "Fault cleared by new hold");
          id(fault_latched) = 0;
          ESP_LOGI("hold", "Hold started: mode %d, %d s, target %.1f°F",
                   mode, secs, id(target_f).state);
          id(led_ack)->execute();

  # Web "Stop": everything off, then a quiet period so an eco filter cycle
  # doesn't immediately restart the pump (heater run-on still applies).
  - id: stop_hold
    then:
      - lambda: |-
          ESP_LOGI("hold", "Stop: holds, button session and filter cycle cleared, quiet %d min",
                   (int) id(quiet_min).state);
          id(hold_mode) = 0;
          id(hold_remaining) = 0;
          id(grace_remaining) = 0;
          id(btn_mode) = 0;
          id(btn_remaining) = 0;
          id(quiet_remaining) = (int) id(quiet_min).state * 60;
          id(filter_active) = false;
      - script.execute: led_ack

  # Jets: a button session layered over any hold/filter cycle, so heating
  # resumes when it ends. level 0 ends the session, 1 = LOW, 2 = HIGH.
  # Used by the tub button and by the web app / Home Assistant.
  - id: set_jets
    parameters:
      level: int
    then:
      - lambda: |-
          if (level < 0 || level > 2) {
            ESP_LOGW("button", "Rejected jets level %d", level);
            return;
          }
          if (level == 0) {
            if (id(btn_mode) != 0) ESP_LOGI("button", "Jets off");
            id(btn_mode) = 0;
            id(btn_remaining) = 0;
          } else {
            id(btn_mode) = level;
            id(btn_remaining) = (int) id(button_session_min).state * 60;
            id(quiet_remaining) = 0;
            ESP_LOGI("button", "Jets %s for %d min", level == 2 ? "HIGH" : "LOW",
                     (int) id(button_session_min).state);
          }
          id(led_ack)->execute();

  # Quiet: everything off for quiet_min. Pump-only holds are cancelled; Heat
  # holds and filter cycles resume when quiet ends.
  - id: start_quiet
    then:
      - lambda: |-
          id(btn_mode) = 0;
          id(btn_remaining) = 0;
          id(quiet_remaining) = (int) id(quiet_min).state * 60;
          if (id(hold_mode) == 1 || id(hold_mode) == 2) {
            id(hold_mode) = 0;
            id(hold_remaining) = 0;
          }
          id(grace_remaining) = 0;
          ESP_LOGI("button", "Quiet for %d min", (int) id(quiet_min).state);
          id(led_ack)->execute();

  # Tub air button: OFF -> LOW -> HIGH -> quiet (all off).
  - id: button_press
    then:
      - lambda: |-
          const uint32_t now = millis();
          if (now < ${boot_hold_s} * 1000UL) return;
          if (now - id(last_press_ms) < 400) return;   // bounce
          // Judge against where the pump is heading, and against a press made
          // a moment ago that the control loop hasn't acted on yet.
          const int cur = (now - id(last_press_ms) < 2000) ? id(press_result) : id(last_desired);
          const int session = (int) id(button_session_min).state * 60;
          int result;
          if (cur == 0) {
            id(set_jets)->execute(1);
            result = 1;
          } else if (cur == 1) {
            id(set_jets)->execute(2);
            result = 2;
          } else {
            id(start_quiet)->execute();
            result = 0;
          }
          id(last_press_ms) = now;
          id(press_result) = result;
          if (result == 1) id(beep)->execute(1, 150);
          else if (result == 2) id(beep)->execute(2, 150);
          else id(beep)->execute(1, 700);

interval:
  - interval: 1s
    then:
      - lambda: |-
          static const char *const PUMP_NAMES[] = {"OFF", "LOW", "HIGH"};
          static const char *const MODE_NAMES[] = {"OFF", "PUMP_LOW", "PUMP_HIGH", "HEAT"};
          static const char *const FAULT_NAMES[] = {"NONE", "NO_FLOW", "OVER_TEMP", "HEATER_UNKNOWN", "SENSOR_FAIL"};
          const uint32_t now = millis();

          // §4: no relay is commanded in the first few seconds after boot.
          if (now < ${boot_hold_s} * 1000UL) return;

          // --- Timers ---------------------------------------------------------
          if (id(runon_remaining) > 0) id(runon_remaining)--;
          if (id(grace_remaining) > 0) id(grace_remaining)--;
          if (id(hold_remaining) > 0 && --id(hold_remaining) == 0) {
            ESP_LOGI("hold", "Hold expired (%s), reverting", MODE_NAMES[id(hold_mode)]);
            id(hold_mode) = 0;
            id(grace_remaining) = ${grace_s};
          }
          if (id(btn_remaining) > 0 && --id(btn_remaining) == 0) {
            ESP_LOGI("button", "Button session timed out");
            id(btn_mode) = 0;
          }
          if (id(quiet_remaining) > 0 && --id(quiet_remaining) == 0)
            ESP_LOGI("button", "Quiet period over, resuming");
          const bool quiet = id(quiet_remaining) > 0;
          if (id(filter_active) && !quiet) {
            id(filter_elapsed)++;
            if (id(filter_remaining) > 0) id(filter_remaining)--;
          }

          // --- Inputs ---------------------------------------------------------
          const bool busy = id(pump_set)->is_running();
          // DI1 only sees flow on LOW (PS1 is fed from 24V_LOW); on HIGH, trust
          // the pump itself.
          const bool flowing = !busy && ((id(pump_state) == 1 && id(sense_flow).state) ||
                                         (id(pump_state) == 2 && id(relay_run).state));
          if (flowing) id(no_flow_s) = 0;
          else if (id(no_flow_s) < 1000000) id(no_flow_s)++;
          const float water = id(water_temp).state;
          const bool water_ok = !std::isnan(water) &&
                                (now - id(water_last_ms)) < ${sensor_stale_s} * 1000UL;
          const float eco = id(eco_f).state;

          // --- Filter cycle ---------------------------------------------------
          const bool filter_heating = id(filter_active) && id(hold_mode) == 0 && id(heat_wanted);
          if (id(filter_active) && id(filter_remaining) == 0 &&
              !(filter_heating && id(filter_elapsed) < ${filter_max_min} * 60)) {
            ESP_LOGI("filter", "Filter cycle done after %d min", id(filter_elapsed) / 60);
            id(filter_active) = false;
          }
          if (!id(filter_active) && !quiet && id(hold_mode) == 0 && id(btn_mode) == 0) {
            const char *why = nullptr;
            if (id(no_flow_s) >= (int) (id(filter_interval_h).state * 3600)) {
              why = "no flow for the filter interval";
              if (id(fault_latched) != 0) ESP_LOGI("fault", "Fault cleared: retrying on filter cycle");
              id(fault_latched) = 0;
            } else if (water_ok && id(fault_latched) == 0 && water < eco - ${deadband_f}) {
              why = "water below eco";
            }
            if (why != nullptr) {
              id(filter_active) = true;
              id(filter_remaining) = (int) id(filter_duration_min).state * 60;
              id(filter_elapsed) = 0;
              ESP_LOGI("filter", "Filter cycle started: %s", why);
            }
          }

          // --- Pump demand ----------------------------------------------------
          const bool heat_mode = id(hold_mode) == 3;
          int desired;
          if (quiet) desired = 0;
          else if (id(btn_mode) != 0) desired = id(btn_mode);
          else if (id(hold_mode) == 2) desired = 2;
          else if (id(hold_mode) == 1 || heat_mode) desired = 1;
          else if (id(filter_active)) desired = 1;
          else if (id(grace_remaining) > 0) desired = id(pump_state);
          else desired = 0;
          if (desired == 0 && id(runon_remaining) > 0) desired = 1;

          // DI1/DI2 only mean anything once the pump has been on LOW, and is
          // meant to stay there, long enough for PS1 to close.
          const bool settled = !busy && id(pump_state) == 1 && desired == 1 &&
                               (now - id(pump_since)) >= ${flow_settle_s} * 1000UL;

          // --- Heat source and target ----------------------------------------
          const bool filter_heat = id(filter_active) && id(hold_mode) == 0;
          const bool heat_source = !quiet && (heat_mode || filter_heat);
          const float target = heat_mode ? id(target_f).state : eco;

          // --- Faults (§7) ----------------------------------------------------
          int live_fault = 0;
          if (settled && !id(sense_flow).state) live_fault = 1;
          else if (settled && !id(sense_temp).state) live_fault = 2;
          else if (heat_source && !water_ok) live_fault = 4;
          else if (id(relay_heat).state && water_ok &&
                   now - id(heat_on_since) >= ${heater_check_min} * 60000UL &&
                   water - id(heat_start_temp) < ${heater_min_rise_f}) live_fault = 3;
          if (live_fault != 0 && id(fault_latched) == 0) {
            id(fault_latched) = live_fault;
            ESP_LOGW("fault", "Fault %s: heat locked out", FAULT_NAMES[live_fault]);
            id(beep)->execute(3, 150);
          }
          const int shown_fault = live_fault != 0 ? live_fault : id(fault_latched);

          // --- Thermostat (§6) ------------------------------------------------
          if (!water_ok) id(heating) = false;
          else if (water <= target - ${deadband_f}) id(heating) = true;
          else if (water >= target + ${deadband_f}) id(heating) = false;
          id(heat_wanted) = heat_source && id(fault_latched) == 0 && id(heating);
          const bool heat_should = id(heat_wanted) && settled;

          // --- Heat relay (before pump, so heat is always dropped first) -----
          if (id(relay_heat).state && !heat_should) {
            id(relay_heat).turn_off();
            id(runon_remaining) = ${runon_s};
            ESP_LOGI("heat", "Heat OFF, pump run-on %d s", ${runon_s});
          } else if (!id(relay_heat).state && heat_should) {
            id(relay_heat).turn_on();
            id(heat_on_since) = now;
            id(heat_start_temp) = water;
            ESP_LOGI("heat", "Heat ON at %.1f°F (target %.1f°F)", water, target);
          }

          // --- Pump -----------------------------------------------------------
          // Heat off above may have just started a run-on.
          if (desired == 0 && id(runon_remaining) > 0) desired = 1;
          if (!busy && desired != id(pump_state)) id(pump_set)->execute(desired);
          id(last_desired) = desired;

          // --- Status ---------------------------------------------------------
          auto set_text = [](text_sensor::TextSensor *s, const std::string &v) {
            if (!s->has_state() || s->state != v) s->publish_state(v);
          };
          auto hms = [](int s) {
            char b[16];
            snprintf(b, sizeof(b), "%d:%02d:%02d", s / 3600, (s / 60) % 60, s % 60);
            return std::string(b);
          };
          std::string activity;
          if (quiet) activity = "Quiet, " + hms(id(quiet_remaining)) + " left";
          else if (id(btn_mode) != 0)
            activity = std::string("Button ") + PUMP_NAMES[id(btn_mode)] + ", " + hms(id(btn_remaining)) + " left";
          else if (id(hold_mode) != 0)
            activity = std::string("Hold ") + MODE_NAMES[id(hold_mode)] + ", " + hms(id(hold_remaining)) + " left";
          else if (id(filter_active))
            activity = id(filter_remaining) > 0 ? "Filter cycle, " + hms(id(filter_remaining)) + " left"
                                                : std::string("Filter cycle, heating to eco");
          else if (id(runon_remaining) > 0) activity = "Heater run-on";
          else if (id(grace_remaining) > 0) activity = "Hold ending";
          else {
            int next = (int) (id(filter_interval_h).state * 3600) - id(no_flow_s);
            activity = "Idle, filter cycle in " + hms(next > 0 ? next : 0);
          }
          set_text(id(activity_text), activity);
          set_text(id(pump_text), busy ? "SWITCHING" : PUMP_NAMES[id(pump_state)]);
          set_text(id(mode_text), MODE_NAMES[id(hold_mode)]);
          set_text(id(fault_text), FAULT_NAMES[shown_fault]);
          set_text(id(hold_text), hms(id(hold_remaining)));

# ---------------------------------------------------------------------------
# Web page: controls
# ---------------------------------------------------------------------------
select:
  - platform: template
    id: mode_select
    name: Mode
    disabled_by_default: true
    options: ["Off", "Pump Low", "Pump High", "Heat"]
    initial_option: "Heat"
    optimistic: true
    web_server: { sorting_group_id: grp_control, sorting_weight: 1 }
  - platform: template
    id: button_type
    name: Tub button type
    entity_category: config
    options: ["Momentary", "Latching"]
    initial_option: "Momentary"
    optimistic: true
    restore_value: true
    web_server: { sorting_group_id: grp_settings, sorting_weight: 6 }

number:
  - platform: template
    id: target_f
    name: Target temperature
    unit_of_measurement: "°F"
    min_value: ${min_target_f}
    max_value: ${max_target_f}
    step: 0.5
    initial_value: 102
    restore_value: true
    optimistic: true
    mode: box
    web_server: { sorting_group_id: grp_control, sorting_weight: 2 }
  - platform: template
    id: hold_minutes
    name: Duration
    disabled_by_default: true
    unit_of_measurement: min
    min_value: 1
    max_value: ${max_hold_min}
    step: 1
    initial_value: 60
    restore_value: true
    optimistic: true
    mode: box
    web_server: { sorting_group_id: grp_control, sorting_weight: 3 }

  # Settings
  - platform: template
    id: eco_f
    name: Eco temperature
    entity_category: config
    unit_of_measurement: "°F"
    min_value: 34
    max_value: ${max_target_f}
    step: 0.5
    initial_value: ${eco_f}
    restore_value: true
    optimistic: true
    mode: box
    web_server: { sorting_group_id: grp_settings, sorting_weight: 1 }
  - platform: template
    id: filter_interval_h
    name: Filter cycle after no flow for
    entity_category: config
    unit_of_measurement: h
    min_value: 1
    max_value: 48
    step: 1
    initial_value: 12
    restore_value: true
    optimistic: true
    mode: box
    web_server: { sorting_group_id: grp_settings, sorting_weight: 2 }
  - platform: template
    id: filter_duration_min
    name: Filter cycle length
    entity_category: config
    unit_of_measurement: min
    min_value: 10
    max_value: 240
    step: 5
    initial_value: 60
    restore_value: true
    optimistic: true
    mode: box
    web_server: { sorting_group_id: grp_settings, sorting_weight: 3 }
  - platform: template
    id: button_session_min
    name: Button session length
    entity_category: config
    unit_of_measurement: min
    min_value: 5
    max_value: 120
    step: 5
    initial_value: 30
    restore_value: true
    optimistic: true
    mode: box
    web_server: { sorting_group_id: grp_settings, sorting_weight: 4 }
  - platform: template
    id: quiet_min
    name: Quiet period
    entity_category: config
    unit_of_measurement: min
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 10
    restore_value: true
    optimistic: true
    mode: box
    web_server: { sorting_group_id: grp_settings, sorting_weight: 5 }

button:
  - platform: template
    name: Start
    disabled_by_default: true
    web_server: { sorting_group_id: grp_control, sorting_weight: 4 }
    on_press:
      - lambda: |-
          auto idx = id(mode_select).active_index();
          int mode = idx.has_value() ? (int) idx.value() : 0;
          id(start_hold)->execute(mode, id(target_f).state, (int) id(hold_minutes).state * 60);
  - platform: template
    name: Stop
    web_server: { sorting_group_id: grp_control, sorting_weight: 5 }
    on_press:
      - script.execute: stop_hold
  - platform: template
    name: Simulate tub button
    disabled_by_default: true
    entity_category: diagnostic
    web_server: { sorting_group_id: grp_diag, sorting_weight: 1 }
    on_press:
      - script.execute: button_press
  - platform: template
    name: Filter now
    entity_category: config
    web_server: { sorting_group_id: grp_control, sorting_weight: 6 }
    on_press:
      - lambda: |-
          id(no_flow_s) = 1000000;   // due immediately; loop starts it next tick

# ---------------------------------------------------------------------------
# Web page: status
# ---------------------------------------------------------------------------
text_sensor:
  - platform: template
    id: activity_text
    name: Activity
    web_server: { sorting_group_id: grp_status, sorting_weight: 1 }
  - platform: template
    id: mode_text
    name: Active hold
    web_server: { sorting_group_id: grp_status, sorting_weight: 2 }
  - platform: template
    id: hold_text
    name: Hold time remaining
    web_server: { sorting_group_id: grp_status, sorting_weight: 3 }
  - platform: template
    id: pump_text
    name: Pump
    web_server: { sorting_group_id: grp_status, sorting_weight: 4 }
  - platform: template
    id: fault_text
    name: Fault
    web_server: { sorting_group_id: grp_status, sorting_weight: 6 }

binary_sensor:
  - platform: template
    name: Heat requested
    lambda: 'return id(heat_wanted);'
    web_server: { sorting_group_id: grp_status, sorting_weight: 5 }
  - platform: template
    name: CH1 RUN
    entity_category: diagnostic
    lambda: 'return id(relay_run).state;'
    web_server: { sorting_group_id: grp_io, sorting_weight: 1 }
  - platform: template
    name: CH2 SELECT (on = HIGH)
    entity_category: diagnostic
    lambda: 'return id(relay_select).state;'
    web_server: { sorting_group_id: grp_io, sorting_weight: 2 }
  - platform: template
    name: CH3 HEAT
    entity_category: diagnostic
    lambda: 'return id(relay_heat).state;'
    web_server: { sorting_group_id: grp_io, sorting_weight: 3 }
