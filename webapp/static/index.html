<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1d26">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hot Tub">
  <title>Hot Tub</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <!-- iOS can't use an SVG home-screen icon: it needs the PNG. -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css?v=202610081425">
</head>
<body>
  <header class="bar">
    <h1>Hot Tub</h1>
    <div class="bar-right">
      <button class="unit" id="unit" aria-label="Switch units">°F</button>
      <span class="dot" id="dot" title="Connecting…"></span>
    </div>
  </header>

  <main>
    <div class="offline" id="offline" hidden>Can't reach the tub controller. Showing the last known state.</div>
    <div class="fault" id="fault" hidden></div>

    <div class="tabs" role="tablist">
      <button role="tab" id="tabNow" class="on" aria-selected="true">Now</button>
      <button role="tab" id="tabHist" aria-selected="false">History</button>
    </div>

    <section class="hero" id="panelNow" aria-live="polite">
      <div class="ring" id="ring">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <circle class="track" cx="100" cy="100" r="88"/>
          <circle class="arc" id="arc" cx="100" cy="100" r="88"/>
        </svg>
        <div class="reading">
          <div class="temp"><span id="water">--</span><span class="deg" id="waterUnit">°F</span></div>
          <div class="eta" id="eta" hidden></div>
          <div class="eco" id="eco" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19c0-9 6-14 15-14 0 9-5 15-14 15"/><path d="M5 19c3-5 6-8 10-10"/></svg>
            <span id="ecoText"></span>
          </div>
          <div class="out">Outside <span id="outdoor">--</span><span id="outUnit">°F</span></div>
        </div>
      </div>
      <div class="activity" id="activity">Connecting…</div>
      <div class="chips">
        <span class="chip" id="chipPump">Pump —</span>
        <span class="chip" id="chipHeat">Heater —</span>
      </div>
    </section>

    <section class="card chartcard" id="panelHist" hidden>
      <div class="charthead">
        <h2>Temperature</h2>
        <div class="seg small" id="range" role="radiogroup" aria-label="Time range">
          <button data-h="6">6 h</button>
          <button data-h="24" class="on">24 h</button>
          <button data-h="168">7 d</button>
        </div>
      </div>
      <div class="chart" id="chart">
        <svg id="chartSvg" role="img" aria-label="Water and outside temperature over time"></svg>
        <div class="tip" id="tip" hidden></div>
      </div>
      <div class="legend">
        <span><i class="sw water"></i>Water</span>
        <span><i class="sw out"></i>Outside</span>
        <span><i class="sw target"></i>Target</span>
        <span><i class="sw heat"></i>Heater on</span>
      </div>
    </section>

    <section class="card setrow">
      <div class="stepper">
        <button class="step" id="down" aria-label="Lower">−</button>
        <div class="target"><span id="target">--</span><span class="deg" id="targetUnit">°F</span></div>
        <button class="step" id="up" aria-label="Higher">+</button>
      </div>
      <button class="primary" id="heat">Set</button>
    </section>

    <section class="card row">
      <span class="rowlabel">Jets</span>
      <div class="seg" id="jets" role="radiogroup" aria-label="Jets">
        <button data-level="off">Off</button>
        <button data-level="high">On</button>
      </div>
    </section>

    <section class="actions">
      <button class="secondary" id="quiet">Quiet</button>
      <button class="danger" id="stop">Eco Mode</button>
    </section>

    <footer>
      <span id="power"></span>
      <a href="/admin">Admin</a>
    </footer>
  </main>

  <div class="toast" id="toast" role="status"></div>
  <script src="common.js?v=202610081425"></script>
  <script src="chart.js?v=202610081425"></script>
  <script src="app.js?v=202610081425"></script>
</body>
</html>
